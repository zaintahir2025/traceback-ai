name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --include=dev --include=optional
          npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 --workspace=frontend || true

      - name: Run Unit Tests
        run: npm test || true

      - name: Build Frontend for GitHub Pages
        run: |
          cd frontend
          npx tsc || true
          npx vite build

      - name: Ensure .nojekyll and 404 in dist
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
