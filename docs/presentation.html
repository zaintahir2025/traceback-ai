    let currentSlide = 0;
    let showNotes = true;

    // Populate Dropdown
    const picker = document.getElementById('slidePicker');
    slides.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = `Slide ${idx + 1}: ${s.title.slice(0, 32)}...`;
      picker.appendChild(opt);
    });

    function renderSlide(idx) {
      const s = slides[idx];
      const viewport = document.getElementById('slideViewport');

      let topBar = '';
      if (s.id > 1) {
        topBar = `
          <div class="slide-top-bar">
            <span class="slide-category">${s.category.toUpperCase()}</span>
            <span class="slide-number">Slide ${idx + 1} of ${slides.length}</span>
          </div>
          <div class="slide-heading">${s.title}</div>
          <div class="slide-subheading">${s.sub}</div>
        `;
      }

      viewport.innerHTML = `
        ${topBar}
        <div class="slide-body">
          ${s.render}
        </div>
      `;

      document.getElementById('slideCounter').innerText = `Slide ${idx + 1} of ${slides.length}`;
      document.getElementById('notesContent').innerText = s.notes;
      document.getElementById('slidePicker').value = idx;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function jumpToSlide(val) {
      currentSlide = parseInt(val, 10);
      renderSlide(currentSlide);
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const box = document.getElementById('speakerNotesBox');
      const btn = document.getElementById('notesToggleBtn');
      box.style.display = showNotes ? 'block' : 'none';
      btn.innerText = showNotes ? 'Hide Speaker Notes' : 'Show Speaker Notes';
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    renderSlide(0);
  </script>
