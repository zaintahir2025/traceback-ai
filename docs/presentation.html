    "sub": "Quantifying where enterprise cash disappears in procurement cycles.",
    "render": "\n        <div class=\"grid-4\" style=\"height:100%;\">\n          <div class=\"card\" style=\"border-color:#f43f5e;\">\n            <div class=\"card-title highlight-red\">1. QUANTITY OVERBILLING</div>\n            <div style=\"font-size:0.75rem; font-family:'JetBrains Mono'; color:#f43f5e; margin-bottom:0.5rem; font-weight:700;\">45% OF TOTAL LEAKAGE</div>\n            <div class=\"card-desc\">Suppliers invoice for ordered quantities rather than delivered quantities. Warehouse damaged or short receipt decrements rarely reach Accounts Payable.</div>\n            <div style=\"font-size:0.75rem; color:#fca5a5; background:rgba(244,63,94,0.1); padding:0.5rem; border-radius:0.5rem; border:1px solid rgba(244,63,94,0.3); margin-top:0.5rem;\">PO-1001: 120 invoiced vs 100 received = $1,000 loss</div>\n          </div>\n          <div class=\"card\" style=\"border-color:#f59e0b;\">\n            <div class=\"card-title highlight-amber\">2. RATE ESCALATION</div>\n            <div style=\"font-size:0.75rem; font-family:'JetBrains Mono'; color:#f59e0b; margin-bottom:0.5rem; font-weight:700;\">30% OF TOTAL LEAKAGE</div>\n            <div class=\"card-desc\">Suppliers quietly bill standard catalogue prices instead of negotiated master contract schedules. Creep accumulates across thousands of line items.</div>\n            <div style=\"font-size:0.75rem; color:#fde68a; background:rgba(245,158,11,0.1); padding:0.5rem; border-radius:0.5rem; border:1px solid rgba(245,158,11,0.3); margin-top:0.5rem;\">PO-1001: Billed $50 vs $48 contract = $200 loss</div>\n          </div>\n          <div class=\"card\" style=\"border-color:#38bdf8;\">\n            <div class=\"card-title highlight-sky\">3. PHANTOM FEES</div>\n            <div style=\"font-size:0.75rem; font-family:'JetBrains Mono'; color:#38bdf8; margin-bottom:0.5rem; font-weight:700;\">15% OF TOTAL LEAKAGE</div>\n            <div class=\"card-desc\">Invoices add unapproved handling fees, logistics surcharges, fuel indexing, or expediting tariffs violating master contract terms prohibiting auxiliary billing.</div>\n            <div style=\"font-size:0.75rem; color:#bae6fd; background:rgba(56,189,248,0.1); padding:0.5rem; border-radius:0.5rem; border:1px solid rgba(56,189,248,0.3); margin-top:0.5rem;\">Unapproved $150 logistics fee appended without CPO approval</div>\n          </div>\n          <div class=\"card\" style=\"border-color:#a855f7;\">\n            <div class=\"card-title highlight-purple\">4. DUPLICATES</div>\n            <div style=\"font-size:0.75rem; font-family:'JetBrains Mono'; color:#a855f7; margin-bottom:0.5rem; font-weight:700;\">10% OF TOTAL LEAKAGE</div>\n            <div class=\"card-desc\">Resubmitted invoices for previously cleared purchase orders, altered invoice numbers, or cross-entity double billing evading simple relational uniqueness.</div>\n            <div style=\"font-size:0.75rem; color:#e9d5ff; background:rgba(168,85,247,0.1); padding:0.5rem; border-radius:0.5rem; border:1px solid rgba(168,85,247,0.3); margin-top:0.5rem;\">Vendor resubmits invoice with suffix \"-A\" after 60 days</div>\n          </div>\n        </div>\n      ",
    "notes": "Where exactly does this money leak? Our taxonomy identifies four distinct vectors: Forty-five percent is quantity overbilling, where vendors bill the purchase order quantity rather than the dock receipt quantity. Thirty percent is contract rate escalation, where prices quietly drift above contract caps. Fifteen percent is phantom fees. And ten percent is duplicate billing."

lor:#10b981;\">ZERO LEAKAGE DEFENSE</span>\n            </div>\n            <div style=\"font-size:0.85rem; color:#cbd5e1;\">Simultaneously reconciles Purchase Order, Warehouse Delivery Receipt, AP Invoice, and Legal Contract Price Schedule. Catches both quantity mismatches AND rate creep with cell-level audit citations.</div>\n          </div>\n        </div>\n      ",

    let currentSlide = 0;
    let showNotes = true;

    function init() {
      const picker = document.getElementById('slidePicker');
      picker.innerHTML = slides.map((s, idx) => 
        `<option value="${idx}">Slide ${s.id}: [${s.section}] ${s.title}</option>`
      ).join('');
      renderSlide();
    }

    function renderSlide() {
      const s = slides[currentSlide];
      const vp = document.getElementById('slideViewport');

      vp.innerHTML = `
        <div class="slide-top-bar">
          <div class="slide-category">${s.section.toUpperCase()}</div>
          <div style="display:flex; gap:0.5rem;">
            <span class="badge" style="background:#082F49; border-color:#0284C7; color:#7DD3FC;">ZETARIS FEDERATED</span>
            <span class="badge" style="background:#064E3B; border-color:#059669; color:#6EE7B7;">METERLESS NIGHTSHIFT</span>
          </div>
          <div class="slide-number">SLIDE ${s.id} OF ${slides.length}</div>
        </div>
        <div class="slide-heading">${s.title}</div>
        <div class="slide-sub">${s.sub}</div>
        <div class="slide-body">${s.render}</div>
      `;

      document.getElementById('slideCounter').innerText = `Slide ${s.id} of ${slides.length}`;
      document.getElementById('slidePicker').value = currentSlide;
      document.getElementById('notesContent').innerText = s.notes || "No notes available.";
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function jumpToSlide(idx) {
      currentSlide = parseInt(idx, 10);
      renderSlide();
    }

    function toggleNotes() {
      showNotes = !showNotes;
      document.getElementById('speakerNotesBox').style.display = showNotes ? 'block' : 'none';
      document.getElementById('notesToggleBtn').innerText = showNotes ? 'Hide Speaker Notes' : 'Show Speaker Notes';
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      }
    });

    init();
  </script>
